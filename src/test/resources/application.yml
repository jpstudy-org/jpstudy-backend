spring:
  application:
    name: jpstudy

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 'test-client-id'
            client-secret: 'test-client-secret'
            redirect-uri: 'http://test.com/login/oauth2/code/google'
            scope:
              - profile
              - email

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
    open-in-view: false

  flyway:
    enabled: false

jwt:
  secret-key: 'this-is-a-dummy-secret-key-for-testing-purposes-only-12345'

cloudflare:
  r2:
    bucket: aa
    account-id: aa
    access-key-id: aa
    secret-access-key: aa

server:
  port: 0

app:
  frontend:
    base-uri: aa

logging:
  level:
    root: info

cors:
  allowed-origins: '*'