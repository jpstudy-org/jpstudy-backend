spring:
  application:
    name: jpstudy
  config:
    import:
      - optional:file:.env[.properties]

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${BACKEND_URI}/login/oauth2/code/google
            scope:
              - profile
              - email

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD:}
      username: default

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DDL}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOE_SQL:false}
    open-in-view: false

  cloud:
    azure:
      communication:
        email:
          connection-string: ${AZURE_EMAIL_ENDPOINT}
          sender-address: ${AZURE_EMAIL_SENDER_ADDRESS}

  flyway:
    baseline-on-migrate: true
    enabled: ${FLYWAY_ENABLED}
    locations: classpath:db/migration

jwt:
  secret-key: ${JWT_SECRET_KEY}

cloudflare:
  r2:
    bucket: ${CLOUDFLARE_BUCKET_NAME}
    account-id: ${CLOUDFLARE_ACCOUNT_ID}
    access-key-id: ${CLOUDFLARE_ACCESS_KEY}
    secret-access-key: ${CLOUDFLARE_SECRET_KEY}

server:
  port: 8080

app:
  frontend:
    base-uri: ${FRONTEND_URI}

logging:
  level:
    root: info

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: "health, info, prometheus"
  metrics:
    tags:
      application: ${spring.application.name}